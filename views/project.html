<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Project | MUSE</title>

<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/project.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="sky-bg">

<div class="stars-layer" id="starsLayer"></div>

<div class="cloud cloud--a"></div>
<div class="cloud cloud--b"></div>
<div class="cloud cloud--c"></div>

<div class="glow-orb glow-orb--1"></div>
<div class="glow-orb glow-orb--2"></div>

</div>

<main class="project-page">

<div class="project-card">

<a href="/dashboard" class="back-link">

← Back to Dashboard

</a>

<h1>

<span class="text-gradient">

Continue Building

</span>

</h1>

<p class="subtitle">

Every great project evolves one step at a time.

</p>

<form id="editProjectForm">

<div class="input-group">

<label>Project Title</label>

<input
type="text"
id="title">

</div>

<div class="input-group">

<label>Vision</label>

<input
type="text"
id="vision">

</div>

<div class="input-group">

<label>Thoughts</label>

<textarea
id="thoughts"
rows="10"></textarea>

</div>

<div class="input-group">

<label>Github</label>

<input
type="url"
id="github">

</div>

<div class="input-group">

<label>Reference</label>

<input
type="url"
id="reference">

</div>



<button class="btn btn--primary">

💾 Save Changes

</button>

<button
    type="button"
    id="deleteBtn"
    class="btn btn--danger">

    🗑 Delete Project

</button>


<h2 class="ai-title">
    ✨ Muse AI
</h2>

<p class="ai-subtitle">
    Your personal brainstorming partner.
    Ask about architecture, features, bugs or next steps.
</p>

<textarea
id="aiPrompt"
class="ai-input"
rows="5"
placeholder="Example:
• How can I improve this project?
• Suggest new features.
• Help me debug my code.
• Write the backend for authentication.">
</textarea>

<button
    class="btn btn--primary"
    id="askAI">

✨ Ask AI

</button>

<div id="aiResponse" class="ai-response">

    Muse AI is ready...
</div>
</form>

</div>

</main>

<script src="/js/script.js"></script>
<script src="/js/project.js"></script>

</body>

</html>
